<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════
         SEO PRIMARY
    ═══════════════════════════════════════════ -->
    <title>IMIRI – Produits Naturels Marocains | منتجات طبيعية مغربية</title>

    <meta name="robots" content="index, follow" />

    ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.imiri.ma/" />
    <meta property="og:title" content="IMIRI – Produits Naturels Marocains Authentiques" />
    <meta property="og:description" content="Découvrez nos produits naturels marocains : huile d'argan, savon beldi, ghassoul. Qualité artisanale, livraison mondiale." />
    <meta property="og:image" content="https://www.imiri.ma/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:locale:alternate" content="ar_MA" />

    ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@imiri_ma" />
    <meta name="twitter:title" content="IMIRI – Produits Naturels Marocains" />
    <meta name="twitter:description" content="Produits naturels marocains authentiques. Huile d'argan, savon beldi, ghassoul et plus." />
    <meta name="twitter:image" content="https://www.imiri.ma/og-image.jpg" />

    ═══════════════════════════════════════════ -->

    <meta name="geo.placename" content="Maroc" />
    <link rel="alternate" hreflang="fr" href="https://www.imiri.ma/" />
    <link rel="alternate" hreflang="ar" href="https://www.imiri.ma/?lang=ar" />
    <link rel="alternate" hreflang="en" href="https://www.imiri.ma/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://www.imiri.ma/" />

    ═══════════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA (JSON-LD)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "IMIRI",
      "url": "https://www.imiri.ma",
      "logo": "https://www.imiri.ma/logo.png",
      "description": "Produits naturels marocains authentiques : huile d'argan, savon beldi, ghassoul.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "MA"
      },
      "sameAs": [
        "https://www.facebook.com/imiri.ma",
        "https://www.instagram.com/imiri.ma"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "IMIRI",
      "url": "https://www.imiri.ma",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.imiri.ma/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════
